[build-system]
requires = ["uv_build >= 0.7.19, <0.9.0"]
build-backend = "uv_build"

[project]
name = "rakam-systems-agent"
version = "0.1.6"
description = "AI Agents framework with Pydantic AI support and LLM Gateway integration"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Mohamed Hilel", email = "mohammedjassemhlel@gmail.com"},
    {name = "Peng Zheng", email = "pengzheng990630@outlook.com"}
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "rakam-systems-core>=0.1.4",
    "rakam-systems-tools>=0.2.2",
    "pydantic>=2.11.5,<3.0.0",
    # >=1.14: ModelGateway threads a caller's own provider client through
    # `infer_model(provider_factory=...)`, which landed in 1.14.0 -- it is the
    # only public seam that injects a client without us mapping provider ->
    # model class ourselves (1.13 and older take no provider_factory).
    "pydantic-ai>=1.14.0,<2.0.0",
    "pyyaml>=6.0,<7.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=5.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "pytest>=7.0.0",
]


[project.optional-dependencies]
# LLM providers
llm-providers = [
    "openai>=1.37.0,<3.0.0",
    # >=1.9.11 is what pydantic-ai-slim[mistral] itself required while it was on
    # the 1.x line, and the oldest release where mistralai.models.{MistralError,
    # ResponseFormat, JSONSchema} are all present. <2.0.0 because mistralai 2.x
    # dropped the top-level package -- `Mistral` moved to mistralai.client.sdk, so
    # `from mistralai import Mistral` in mistral_gateway.py would fail outright.
    "mistralai>=1.9.11,<2.0.0",
    # The cap that PAIRS with the one above, and the reason it lives in this extra
    # rather than in [project.dependencies]: pydantic_ai/providers/mistral.py
    # switched from `from mistralai import Mistral` to `from mistralai.client
    # import Mistral` in 1.76.0, tracking mistralai's 2.x repackaging. The two
    # libraries must therefore agree on a major, and there are two coherent
    # worlds: (pydantic-ai <1.76, mistralai 1.x) and (pydantic-ai >=1.76,
    # mistralai 2.x). Pinning the FIRST here -- and only here -- keeps
    # `MistralGateway`, which needs mistralai 1.x, working, while a bare install
    # that wants none of these SDKs still resolves the full pydantic-ai range and
    # reaches `mistral:` chat through the second world. Widening this is a
    # mistralai-2.x migration, not a version bump.
    "pydantic-ai<1.76.0",
    "tiktoken>=0.7.0,<1.0.0",
]

# PostgreSQL chat history backend
postgres = [
    "psycopg2-binary>=2.9.9,<3.0.0",
]

# All optional dependencies
all = [
    "rakam-systems-agent[llm-providers]",
    "rakam-systems-agent[postgres]",
]


[project.urls]
Homepage = "https://github.com/Rakam-AI/rakam_systems-inhouse"
Documentation = "https://github.com/Rakam-AI/rakam_systems-inhouse"
Repository = "https://github.com/Rakam-AI/rakam_systems-inhouse"



# Monorepo dev only: resolve the sibling core from the local checkout instead
# of PyPI so UNRELEASED rakam-systems-core APIs can be tested before they are
# published. Active now because the metering hook contract (UsageHook /
# NoopUsageHook) ships in the upcoming rakam-systems-core>=0.1.4, which is not
# on PyPI yet. Comment this back out once 0.1.4 is published. uv strips
# [tool.uv.sources] from the built wheel, so the published package is unaffected.
# [tool.uv.sources]
# rakam-systems-core = { path = "../../core", editable = true }

[tool.uv.build-backend]
module-root = "src"
exclude = ["**/tests/**"]

